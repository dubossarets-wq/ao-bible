4\u0435\u043B\u0430: pos \u2014 \u0447\u0430\u0441\u0442\u0438 \u0440\u0435\u0447\u0438: { \u043A\u043E\u0434: { ru, abbr, forms: [ { slots: [...], when? } ] } }; slots \u2014 \u0442\u0430\u0431\u043B\u0438\u0446\u044B \u0437\u043D\u0430\u0447\u0435\u043D\u0438\u0439: { \u0438\u043C\u044F \u0441\u043B\u043E\u0442\u0430: { \u043A\u043E\u0434 \u0437\u043D\u0430\u0447\u0435\u043D\u0438\u044F: { ru, abbr } } }. \u0421\u043B\u043E\u0442 '-' \u0432 \u0441\u043F\u0438\u0441\u043A\u0435 slots \u2014 \u0431\u0443\u043A\u0432\u0430\u043B\u044C\u043D\u044B\u0439 \u0434\u0435\u0444\u0438\u0441 (\u0442\u043E\u043B\u044C\u043A\u043E \u0433\u0440\u0435\u0447\u0435\u0441\u043A\u0438\u0439). \u041A\u043B\u044E\u0447\u0438 \u0437\u043D\u0430\u0447\u0435\u043D\u0438\u0439 \u0431\u044B\u0432\u0430\u044E\u0442 \u0438\u0437 \u043D\u0435\u0441\u043A\u043E\u043B\u044C\u043A\u0438\u0445 \u0441\u0438\u043C\u0432\u043E\u043B\u043E\u0432 (2A, PRI, 1S) \u2014 \u043F\u0440\u0438 \u0440\u0430\u0437\u0431\u043E\u0440\u0435 \u0431\u0435\u0440\u0451\u0442\u0441\u044F \u0441\u0430\u043C\u044B\u0439 \u0434\u043B\u0438\u043D\u043D\u044B\u0439 \u043F\u043E\u0434\u0445\u043E\u0434\u044F\u0449\u0438\u0439 \u043A\u043B\u044E\u0447.","\u0420\u0430\u0437\u0431\u043E\u0440 \u043E\u0434\u043D\u043E\u0439 \u0447\u0430\u0441\u0442\u0438 \u043A\u043E\u0434\u0430 (\u0442\u0435\u043B\u0430) \u043F\u043E \u0444\u043E\u0440\u043C\u0435: \u0438\u0434\u0451\u043C \u043F\u043E slots \u0441\u043B\u0435\u0432\u0430 \u043D\u0430\u043F\u0440\u0430\u0432\u043E; \u0434\u043B\u044F \u043A\u0430\u0436\u0434\u043E\u0433\u043E \u0441\u043B\u043E\u0442\u0430 \u0431\u0435\u0440\u0451\u043C \u0438\u0437 \u043D\u0430\u0447\u0430\u043B\u0430 \u0441\u0442\u0440\u043E\u043A\u0438 \u0441\u0430\u043C\u044B\u0439 \u0434\u043B\u0438\u043D\u043D\u044B\u0439 \u043A\u043B\u044E\u0447 \u0438\u0437 slots[\u0438\u043C\u044F]; \u0435\u0441\u043B\u0438 \u043A\u043B\u044E\u0447\u0430 \u043D\u0435\u0442 \u2014 \u0444\u043E\u0440\u043C\u0430 \u043D\u0435 \u043F\u043E\u0434\u0445\u043E\u0434\u0438\u0442. \u0424\u043E\u0440\u043C\u0430 \u043F\u043E\u0434\u0445\u043E\u0434\u0438\u0442, \u0435\u0441\u043B\u0438 \u0441\u0442\u0440\u043E\u043A\u0430 \u0441\u044A\u0435\u0434\u0435\u043D\u0430 \u0446\u0435\u043B\u0438\u043A\u043E\u043C. \u0415\u0441\u043B\u0438 \u0443 \u0440\u0430\u0437\u0434\u0435\u043B\u0430 allowShort = true, \u0445\u0432\u043E\u0441\u0442\u043E\u0432\u044B\u0435 \u0441\u043B\u043E\u0442\u044B \u043C\u043E\u0436\u043D\u043E \u043E\u043F\u0443\u0441\u0442\u0438\u0442\u044C (OSHB \u043D\u0435 \u043F\u0438\u0448\u0435\u0442 \u043D\u0435\u043D\u0443\u0436\u043D\u044B\u0435 \u0445\u0432\u043E\u0441\u0442\u044B: Np, Pf, VNa). when \u2014 \u0434\u043E\u043F\u043E\u043B\u043D\u0438\u0442\u0435\u043B\u044C\u043D\u043E\u0435 \u0443\u0441\u043B\u043E\u0432\u0438\u0435 \u0444\u043E\u0440\u043C\u044B: { \u0438\u043C\u044F \u0441\u043B\u043E\u0442\u0430: [\u0434\u043E\u043F\u0443\u0441\u0442\u0438\u043C\u044B\u0435 \u043A\u043E\u0434\u044B] } (placeholder \u043F\u0440\u043E\u0445\u043E\u0434\u0438\u0442 \u043B\u044E\u0431\u043E\u0435 \u0443\u0441\u043B\u043E\u0432\u0438\u0435). \u0424\u043E\u0440\u043C\u044B \u043F\u0440\u043E\u0431\u0443\u044E\u0442\u0441\u044F \u043F\u043E \u043F\u043E\u0440\u044F\u0434\u043A\u0443, \u0431\u0435\u0440\u0451\u0442\u0441\u044F \u043F\u0435\u0440\u0432\u0430\u044F \u043F\u043E\u0434\u0445\u043E\u0434\u044F\u0449\u0430\u044F.","\u0417\u043D\u0430\u0447\u0435\u043D\u0438\u0435, \u0440\u0430\u0432\u043D\u043E\u0435 placeholder (\u0432 OSHB \u044D\u0442\u043E 'x' \u2014 \xAB\u043D\u0435 \u0443\u043A\u0430\u0437\u0430\u043D\u043E\xBB), \u043F\u043E\u0434\u0445\u043E\u0434\u0438\u0442 \u043A \u043B\u044E\u0431\u043E\u043C\u0443 \u0441\u043B\u043E\u0442\u0443 \u0438 \u0432 \u0442\u0435\u043A\u0441\u0442 \u043D\u0435 \u0432\u044B\u0432\u043E\u0434\u0438\u0442\u0441\u044F.","\u0413\u0420\u0415\u0427\u0415\u0421\u041A\u0418\u0419: code.split('-') \u2192 parts; pos = parts[0]; \u043F\u043E\u0 u0421\u0435\u043F\u0442\u0443\u0430\u0433\u0438\u043D\u0442\u044B), \u0421\u0435\u0440\u0433\u0438\u0435\u0432\u0441\u043A\u0438\u0439 (\u043D\u0435\u043A\u0430\u043D\u043E\u043D\u0438\u0447\u0435\u0441\u043A\u0438\u0435 \u043A\u043D\u0438\u0433\u0438); \u0443 \u041C\u0430\u043A\u0430\u0440\u0438\u044F \u0442\u0435\u043F\u0435\u0440\u044C 30 \u043A\u043D\u0438\u0433 \u0412\u0435\u0442\u0445\u043E\u0433\u043E \u0417\u0430\u0432\u0435\u0442\u0430."),w("\u041D\u043E\u0432\u044B\u0439 \u0417\u0430\u0432\u0435\u0442 \u0432 \u043F\u043E\u0434\u0441\u0442\u0440\u043E\u0447\u043D\u0438\u043A\u0435 \u0442\u043E\u0436\u0435 \u0437\u0432\u0443\u0447\u0438\u0442: \u0433\u0440\u0435\u0447\u0435\u0441\u043A\u0438\u0439 \u0442\u0435\u043A\u0441\u0442 \u0447\u0438\u0442\u0430\u0435\u0442 \u041C\u0430\u0440\u0438\u043B\u0438\u043D \u0424\u0435\u043C\u0438\u0441\u0442\u0435\u0440 (\u044D\u0440\u0430\u0437\u043C\u043E\u0432\u043E \u043F\u0440\u043E\u0438\u0437\u043D\u043E\u0448\u0435\u043D\u0438\u0435). \u0417\u043D\u0430\u0447\u043E\u043A \u0443 \u043A\u0430\u0436\u0434\u043E\u0433\u043E \u0441\u043B\u043E\u0432\u0430 \u043F\u0440\u043E\u0438\u0433\u0440\u044B\u0432\u0430\u0435\u0442 \u0442\u043E\u043B\u044C\u043A\u043E \u044D\u0442\u043E \u0441\u043B\u043E\u0432\u043E, \u0430 \u0432 \u0441\u0442\u0430\u0442\u044C\u0435 \u0421\u0442\u0440\u043E\u043D\u0433\u0430 \u043A\u043D\u043E\u043F\u043A\u0430 \xAB\u041F\u043E\u0441\u043B\u0443\u0448\u0430\u0442\u044C\xBB \u2014 \u0441\u043B\u043E\u0432\u043E \u0436\u0438\u0432\u044B\u043C \u0433\u043E\u043B\u043E\u0441\u043E\u043C."),w("\u041D\u043E\u0432\u044B\u0439 \u0417\u0430\u0432\u0435\u0442 \u2014 \u043F\u043E\u0434\u0441\u0442\u0440\u043E\u0447\u043D\u0438\u043A \u0410. \u0412\u0438\u043D\u043E\u043A\u0443\u0440\u043E\u0432\u0430 (\u0441 \u0440\u0430\u0437\u0440\u0435\u0448\u0435\u043D\u0438\u044F \u0430\u0432\u0442\u043E\u0440\u0430): \u0432 \u043E\u043A\u043D\u0435 \u043F\u043E\u0434\u0441\u0442\u0440\u043E\u0447\u043D\u0438\u043A\u0430 \u0432\u043A\u043B\u0430\u0434\u043A\u0430 \xAB\u0412\u0438\u043D\u043E\u043A\u0443\u0440\u043E\u0432\xBB \u0438 \u043F\u0435\u0440\u0435\u0432\u043E\u0434 \xAB\u041F\u043E\u0434\u0441\u0442\u0440\u043E\u0447\u043D\u0438\u043A (\u0412\u0438\u043D\u043E\u043A\u0443\u0440\u043E\u0432)\xBB \u0434\u043B\u044F \u0447\u0442\u0435\u043D\u0438\u044F."),w("\u0412 \u043F\u043E\u0434\u0441\u0442\u0440\u043E\u0447\u043D\u0438\u043A\u0435 \u0412\u0435\u0442\u0445\u043E\u0433\u043E \u0417\u0430\u0432\u0435\u0442\u0430 \u2014 \u043A\u043D\u043E\u043F\u043A\u0430 \xAB\u0421\u043B\u0443\u0448\u0430\u0442\u044C\xBB: \u0441\u0442\u0438\u0445 \u043D\u0430 \u0438\u0432\u0440\u0438\u0442\u0435 \u0447\u0438\u0442\u0430\u0435\u0442 \u0436\u0438\u0432\u043E\u0439 \u0447\u0442\u0435\u0446 \u0410\u0432\u0440\u0430\u0430\u043C \u0428\u043C\u0443\u044D\u043B\u043E\u0444, \u0437\u0432\u0443\u0447\u0430\u0449\u0435\u0435 \u0441\u043B\u043E\u0432\u043E \u043F\u043E\u0434\u0441\u0432\u0435\u0447\u0438\u0432\u0430\u0435\u0442\u0441\u044F."),w("\u0412 \u043F\u043E\u0438\u0441\u043A\u0435 \u043C\u043E\u0436\u043D\u043E \u0432\u0432\u0435\u0441\u0442\u0438 \u043D\u043E\u043C\u0435\u0440 \u0421\u0442\u0440\u043E\u043D\u0433\u0430 (G26, H7225): \u043F\u043E\u043A\u0430\u0436\u0443\u0442\u0441\u044F \u0441\u043B\u043E\u0432\u043E \u043E\u0440\u0438\u0433\u0438\u043D\u0430\u043B\u0430, \u0435\u0433\u043E \u0437\u043D\u0430\u0447\u0435\u043D\u0438\u0435 \u0438 \u0432\u0441\u0435 \u043C\u0435\u0441\u0442\u0430."),w("\u041F\u0440\u0438\u043B\u043E\u0436\u0435\u043D\u0438\u0435 \u0431\u043E\u043B\u044C\u0448\u0435 \u043D\u0435 \u043F\u043E\u0432\u043E\u0440\u0430\u0447\u0438\u0432\u0430\u0435\u0442\u0441\u044F \u0441\u0430\u043C\u043E, \u043A\u043E\u0433\u0434\u0430 \u0430\u0432\u0442\u043E\u043F\u043E\u0432\u043E\u0440\u043E\u0442 \u0432 \u0442\u0435\u043B\u0435\u0444\u043E\u043D\u0435 \u0432\u044B\u043A\u043B\u044E\u0447\u0435\u043D."),w("\u041F\u043E\u0434\u0441\u0442\u0440\u043E\u0447\u043D\u0438\u043A \u0441\u0442\u0438\u0445\u0430 \u2014 \u0432 \u043F\u043E\u0440\u044F\u0434\u043A\u0435 \u043E\u0440\u0438\u0433\u0438\u043D\u0430\u043B\u0430: \u0435\u0432\u0440\u0435\u0439\u0441\u043A\u0438\u0439 \u0442\u0435\u043A\u0441\u0442 \u0441\u043F\u0440\u0430\u0432\u0430 \u043D\u0430\u043B\u0435\u0432\u043E, \u043F\u043E\u0434 \u043A\u0430\u0436\u0434\u044B\u043C \u0441\u043B\u043E\u0432\u043E\u043C \u2014 \u0435\u0433\u043E \u0447\u0442\u0435\u043D\u0438\u0435, \u043F\u0435\u0440\u0435\u0432\u043E\u0434 \u0438 \u043D\u043E\u043C\u0435\u0440 \u0421\u0442\u0440\u043E\u043D\u0433\u0430.")]},{id:"2026-10-17",items:[w("\u041F\u0440\u0438\u043B\u043E\u0436\u0435\u043D\u0438\u0435 \u0433\u043E\u0432\u043E\u0440\u0438\u0442 \u043D\u0430 22 \u044F\u0437\u044B\u043A\u0430\u0445: \u044F\u0437\u044B\u043A \u0432\u044B\u0431\u0438\u0440\u0430\u0435\u0442\u0441\u044F \u043F\u043E \u044F\u0437\u044B\u043A\u0443 \u0442\u0435\u043B\u0435\u0444\u043E\u043D\u0430, \u0441\u043C\u0435\u043D\u0438\u0442\u044C \u043C\u043E\u0436\u043D\u043E \u0432 \u041D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0438 \u2192 \u042F\u0437\u044B\u043A."),w("\u041F\u043E\u0434\u0441\u0442\u0440\u043E\u0447\u043D\u0438\u043A: \u0437\u0430\u0436\u043C\u0438\u0442\u0435 \u0441\u0442\u0438\u0445 \u2192 \xAB\u22EF\xBB \u2192 \xAB\u041F\u043E\u0434\u0441\u0442\u0440\u043E\u0447\u043D\u0438\u043A\xBB. \u041F\u043E\u0434 \u043A\u0430\u0436\u0434\u044B\u043C \u0441\u043B\u043E\u0432\u043E\u043C \u0441\u0438\u043D\u043E\u0434\u0430\u043B\u044C\u043D\u043E\u0433\u043E \u0442\u0435\u043A\u0441\u0442\u0430 \u2014 \u0441\u043B\u043E\u0432\u043E \u043E\u0440\u0438\u0433\u0438\u043D\u0430\u043B\u0430 (\u0435\u0432\u0440\u0435\u0439\u0441\u043A\u043E\u0435 \u0438\u043B\u0438 \u0433\u0440\u0435\u0447\u0435\u0441\u043A\u043E\u0435) \u0438 \u043D\u043E\u043C\u0435\u0440 \u0421\u0442\u0440\u043E\u043D\u0433\u0430. \u041D\u0438\u0447\u0435\u0433\u043E \u0443\u0441\u0442\u0430\u043D\u0430\u0432\u043B\u0438\u0432\u0430\u0442\u044C \u043D\u0435 \u043D\u0443\u0436\u043D\u043E."),w("\u0412\u0441\u044E \u0411\u0438\u0431\u043B\u0438\u044E \u043C\u043E\u0436\u043D\u043E \u0447\u0438\u0442\u0430\u0442\u044C \u043F\u043E\u0434\u0441\u0442\u0440\u043E\u0447\u043D\u0438\u043A\u043E\u043C: \u0432\u044B\u0431\u0435\u0440\u0438\u0442\u0435 \u043F\u0435\u0440\u0435\u0432\u043E\u0434 \xAB\u041F\u043E\u0434\u0441\u0442\u0440\u043E\u0447\u043D\u0438\u043A\xBB (\u0432 \u0441\u043F\u0438\u0441\u043A\u0435 \u043F\u0435\u0440\u0435\u0432\u043E\u0434\u043E\u0432 \u2192 \xAB\u0423\u0441\u0442\u0430\u043D\u043E\u0432\u0438\u0442\u044C \u0434\u0440\u0443\u0433\u0438\u0435 \u043F\u0435\u0440\u0435\u0432\u043E\u0434\u044B\xBB)."),w("\u0421\u043B\u043E\u0432\u0430\u0440\u044C \u0421\u0442\u0440\u043E\u043D\u0433\u0430 \u043D\u0430 \u0440\u0443\u0441\u0441\u043A\u043E\u043C \u044F\u0437\u044B\u043A\u0435: \u0437\u043D\u0430\u0447\u0435\u043D\u0438\u0435 \u0438 \u043F\u0440\u043E\u0438\u0441\u0445\u043E\u0436\u0434\u0435\u043D\u0438\u0435 \u043A\u0430\u0436\u0434\u043E\u0433\u043E \u0435\u0432\u0440\u0435\u0439\u0441\u043A\u043E\u0433\u043E \u0438 \u0433\u0440\u0435\u0447\u0435\u0441\u043A\u043E\u0433\u043E \u0441\u043B\u043E\u0432\u0430. \u041E\u0442\u043A\u0440\u044B\u0432\u0430\u0435\u0442\u0441\u044F \u043F\u0435\u0440\u0432\u044B\u043C \u043F\u0440\u0438 \u043D\u0430\u0436\u0430\u0442\u0438\u0438 \u043D\u0430 \u0441\u043B\u043E\u0432\u043E \u0438\u043B\u0438 \u043D\u043E\u043C\u0435\u0440 \u0421\u0442\u0440\u043E\u043D\u0433\u0430."),w("\u041D\u0430\u0436\u0430\u0442\u0438\u0435 \u043D\u0430 \u043D\u043E\u043C\u0435\u0440 \u0421\u0442\u0440\u043E\u043D\u0433\u0430 \u0432 \u0442\u0435\u043A\u0441\u0442\u0435 \u0441\u0440\u0430\u0437\u0443 \u043E\u0442\u043A\u0440\u044B\u0432\u0430\u0435\u0442 \u0441\u0442\u0430\u0442\u044C\u044E \u043D\u0430 \u0432\u0435\u0441\u044C \u044D\u043A\u0440\u0430\u043D. \u0417\u0430\u043A\u0440\u044B\u0442\u044C \u2014 \u0441\u043C\u0430\u0445\u043D\u0443\u0442\u044C \u0432\u043D\u0438\u0437."),w("\u0412 \u0441\u0442\u0430\u0442\u044C\u0435 \u0421\u0442\u0440\u043E\u043D\u0433\u0430 \u2014 \u0433\u0440\u0430\u043C\u043C\u0430\u0442\u0438\u0447\u0435\u0441\u043A\u0430\u044F \u0444\u043E\u0440\u043C\u0430 \u0441\u043B\u043E\u0432\u0430 \u043F\u043E-\u0440\u0443\u0441\u0441\u043A\u0438 (\xAB\u0433\u043B\u0430\u0433\u043E\u043B, \u0430\u043E\u0440\u0438\u0441\u0442, \u0434\u0435\u0439\u0441\u0442\u0432\u0438\u0442\u0435\u043B\u044C\u043D\u044B\u0439 \u0437\u0430\u043B\u043E\u0433\u2026\xBB), \u0430 \u0435\u0441\u043B\u0438 \u043E\u0442\u043A\u0440\u044B\u0442\u044C \u0441\u0442\u0430\u0442\u044C\u044E \u0438\u0437 \u0441\u0442\u0438\u0445\u0430 \u2014 \u0442\u043E\u0447\u043D\u0430\u044F \u0444\u043E\u0440\u043C\u0430 \u044D\u0442\u043E\u0433\u043E \u0441\u043B\u043E\u0432\u0430 \u0432 \u043E\u0440\u0438\u0433\u0438\u043D\u0430\u043B\u0435."),w("\u0412 \u043F\u043E\u0434\u0441\u0442\u0440\u043E\u0447\u043D\u0438\u043A\u0435 \u043F\u043E\u0434 \u043A\u0430\u0436\u0434\u044B\u043C \u0441\u043B\u043E\u0432\u043E\u043C \u043E\u0440\u0438\u0433\u0438\u043D\u0430\u043B\u0430 \u2014 \u0435\u0433\u043E \u043F\u0440\u0438\u0431\u043B\u0438\u0437\u0438\u0442\u0435\u043B\u044C\u043D\u043E\u0435 \u0447\u0442\u0435\u043D\u0438\u0435 \u0440\u0443\u0441\u0441\u043A\u0438\u043C\u0438 \u0431\u0443\u043A\u0432\u0430\u043C\u0438."),w("\u0418\u043B\u043B\u044E\u0441\u0442\u0440\u0430\u0446\u0438\u0438, \u043A\u043E\u0442\u043E\u0440\u044B\u0435 \u0432\u044B \u0443\u0436\u0435 \u043E\u0442\u043A\u0440\u044B\u0432\u0430\u043B\u0438, \u043F\u043E\u043A\u0430\u0437\u044B\u0432\u0430\u044E\u0442\u0441\u044F \u0438 \u0431\u0435\u0437 \u0438\u043D\u0442\u0435\u0440\u043D\u0435\u0442\u0430 (\u0445\u0440\u0430\u043D\u044F\u0442\u0441\u044F \u043F\u043E\u0441\u043B\u0435\u0434\u043D\u0438\u0435 120)."),w("\u041D\u0430\u0436\u0430\u0442\u0438\u0435 \u043D\u0430 \u043D\u043E\u043C\u0435\u0440 \u0441\u0442\u0438\u0445\u0430 \u0432\u044B\u0434\u0435\u043B\u044F\u0435\u0442 \u0441\u0442\u0438\u0445 \u2014 \u0442\u0435 \u0436\u0435 \u0434\u0435\u0439\u0441\u0442\u0432\u0438\u044F, \u0447\u0442\u043E \u0438 \u043F\u0440\u0438 \u0434\u043E\u043B\u0433\u043E\u043C \u043D\u0430\u0436\u0430\u0442\u0438\u0438."),w("\u041A\u043D\u043E\u043F\u043A\u0430 \xAB\u041D\u0430\u0437\u0430\u0434\xBB \u043D\u0430 Android \u0437\u0430\u043A\u0440\u044B\u0432\u0430\u0435\u0442 \u043E\u0442\u043A\u0440\u044B\u0442\u043E\u0435 \u043E\u043A\u043D\u043E, \u0430 \u043D\u0435 \u043F\u0440\u0438\u043B\u043E\u0436\u0435\u043D\u0438\u0435."),w("\u0411\u043B\u0435\u0434\u043D\u044B\u0439 \u0442\u0435\u043A\u0441\u0442 \u0441\u0442\u0430\u043B \u0442\u0435\u043C\u043D\u0435\u0435 \u0438 \u043B\u0443\u0447\u0448\u0435 \u0447\u0438\u0442\u0430\u0435\u0442\u0441\u044F; \u043D\u043E\u043C\u0435\u0440 \u0441\u0442\u0438\u0445\u0430 \u0438 \u043A\u043D\u043E\u043F\u043A\u0438 \u043F\u0430\u043D\u0435\u043B\u0438 \u043B\u0435\u0433\u0447\u0435 \u043D\u0430\u0436\u0438\u043C\u0430\u0442\u044C."),w("\u0412\u0441\u0435 \u043C\u0435\u0441\u0442\u0430 \u0441\u043B\u043E\u0432\u0430 \u043E\u0440\u0438\u0433\u0438\u043D\u0430\u043B\u0430: \u0432 \u0441\u0442\u0430\u0442\u044C\u0435 \u0421\u0442\u0440\u043E\u043D\u0433\u0430 \u043A\u043D\u043E\u043F\u043A\u0430 \xAB\u0412\u0441\u0435 \u043C\u0435\u0441\u0442\u0430\xBB \u2014 \u0441\u0442\u0438\u0445\u0438 \u0441 \u0432\u044B\u0434\u0435\u043B\u0435\u043D\u043D\u044B\u043C \u0441\u043B\u043E\u0432\u043E\u043C, \u043C\u043E\u0436\u043D\u043E \u0432\u044B\u0431\u0440\u0430\u0442\u044C, \u043A\u0430\u043A \u043E\u043D\u043E \u043F\u0435\u0440\u0435\u0432\u0435\u0434\u0435\u043D\u043E (\xAB\u0432\u043E\u0437\u043B\u044E\u0431\u0438\u043B\xBB, \xAB\u043B\u044E\u0431\u0438\u0442\xBB\u2026)."),w("\u041E\u0444\u043E\u0440\u043C\u043B\u0435\u043D\u0438\u0435 \u043C\u043E\u0436\u043D\u043E \u043D\u0430\u0441\u0442\u0440\u043E\u0438\u0442\u044C \u043F\u043E\u0434 \u0441\u0435\u0431\u044F: \u0446\u0432\u0435\u0442 \u0432\u0435\u0440\u0445\u043D\u0435\u0439 \u04
